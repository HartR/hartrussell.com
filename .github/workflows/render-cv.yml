name: Render CV PDF

# resume.tex is the source of truth; static/assets/cv.pdf is the build product.
# Netlify ignores pushes that only touch resume.tex (see the `ignore` command in
# netlify.toml), so the deploy that publishes the new PDF is the commit this
# workflow makes, which already contains the rendered file.
#
# static/assets/cv.pdf is tracked by Git LFS, so the LFS objects must be pushed
# before the commit lands — otherwise the commit reaches Netlify with a pointer
# and the site serves a 131-byte text file as the CV.

on:
  push:
    branches: [main]
    paths: ["resume.tex"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-cv
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex

      - name: Install PDF
        run: |
          set -euo pipefail
          test -f resume.pdf
          cp resume.pdf static/assets/cv.pdf
          ls -l static/assets/cv.pdf

      - name: Commit rendered PDF
        run: |
          set -euo pipefail
          git lfs install --local
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/assets/cv.pdf
          if git diff --cached --quiet; then
            echo "rendered PDF is unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "Render CV PDF from resume.tex"
          git lfs push --all origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
