{{ define "main" }}
<article class="post">
  <p class="back"><a href="{{ "/blog/" | relURL }}">← Blog</a></p>
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    <p class="post-meta"><time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "January 2, 2006" }}</time></p>
  </header>
  <div class="prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
